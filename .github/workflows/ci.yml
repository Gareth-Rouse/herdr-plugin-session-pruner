name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck sessionPruner.sh tests/pruneTest.sh
      - name: tests
        run: bash tests/pruneTest.sh
